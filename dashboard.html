<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Bento Class</title>

  <link
    rel="stylesheet"
    href="css/dashboard.css">
</head>

<body>

  <header class="hero">

    <div>

      <h1>Bento Class</h1>

      <p class="subtitle">
        Learn to Read English
      </p>

      <p class="description">
        Aprenda inglês lendo, ouvindo,
        falando e escrevendo através
        de um método fonético estruturado.
      </p>

      <button
        id="continueBtn"
        class="primary-btn">

        ▶️ Continuar estudando

      </button>

    </div>

    <div class="stats">

      <div class="stat-card">
        <span>🔥</span>
        <strong id="streak">
          0
        </strong>
        <small>Dias</small>
      </div>

      <div class="stat-card">
        <span>⭐</span>
        <strong id="points">
          0
        </strong>
        <small>Pontos</small>
      </div>

      <div class="stat-card">
        <span>🏆</span>
        <strong id="completed">
          0
        </strong>
        <small>Blocos</small>
      </div>

    </div>

  </header>

  <main>

   <header class="hero">
  <h1>Bento Class</h1>
  <p>Learn English Naturally</p>
</header>

<section class="stats">

  <div class="stat-card">
    <span>🔥</span>
    <strong id="streak">7</strong>
    <small>Days</small>
  </div>

  <div class="stat-card">
    <span>⭐</span>
    <strong id="points">1250</strong>
    <small>Points</small>
  </div>

  <div class="stat-card">
    <span>🏆</span>
    <strong id="lessonsDone">18</strong>
    <small>Lessons</small>
  </div>

</section>

<section class="quote-card">
  <p id="dailyQuote"></p>
</section>

<section id="currentBlock"></section>

<section id="journey"></section>

<button
  id="viewPath"
  class="secondary-btn">
  🗺️ View Learning Path
</button> 

  </main>

  <div
    <div id="pathModal">

    <div class="modal-card">

      <h2>
        🗺️ Jornada Completa
      </h2>

      <div id="fullPath">
      </div>

      <button
        id="closeModal"
        class="primary-btn">

        Fechar

      </button>

    </div>

  </div>

  <script src="js/taxonomy.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/dashboard.js"></script>

</body>
</html>
