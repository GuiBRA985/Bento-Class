<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 30px;
    }

    .box {
      max-width: 900px;
      margin: auto;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #334155;
    }

    button {
      margin-top: 20px;
      padding: 10px;
      width: 100%;
      background: red;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>Painel Admin</h1>
  <p id="status">Verificando acesso...</p>

  <table>
    <thead>
      <tr>
        <th>Email</th>
        <th>Role</th>
        <th>ID</th>
      </tr>
    </thead>
    <tbody id="users"></tbody>
  </table>

  <button onclick="logout()">Sair</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  const supabase = window.supabase.createClient(
    "https://ymbkyjdtjpegqelnirzi.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InltYmt5amR0anBlZ3FlbG5pcnppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3ODM5NzUsImV4cCI6MjA5NjM1OTk3NX0.2qYLqsc8cgeTCf0edLf-7BeyeqWQcct2ONBGeFgmp4o"
  );

  const { data: { user } } = await supabase.auth.getUser();

  if (!user) {
    window.location.href = "/index.html";
    return;
  }

  // pega perfil do usuário logado
  const { data: profile } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if (!profile || profile.role !== "admin") {
    document.body.innerHTML = "<h2>Acesso negado</h2>";
    return;
  }

  document.getElementById("status").innerText =
    "Logado como admin: " + user.email;

  // lista todos perfis (SÓ ADMIN CONSEGUE POR CAUSA DO RLS)
  const { data: users } = await supabase
    .from("profiles")
    .select("*");

  const tbody = document.getElementById("users");

  users.forEach(u => {
    tbody.innerHTML += `
      <tr>
        <td>${u.email}</td>
        <td>${u.role}</td>
        <td>${u.id}</td>
      </tr>
    `;
  });

  window.logout = async function () {
    await supabase.auth.signOut();
    window.location.href = "/index.html";
  };

});
</script>

</body>
</html>
