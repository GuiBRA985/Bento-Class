<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Bento Class</title>

  <link
    rel="stylesheet"
    href="css/dashboard.css">
</head>
<body>

<header class="hero">

  <h1>Bento Class</h1>
  <p>Learn English Naturally</p>

</header>

<main>

  <section class="stats">

    <div class="stat-card">
      <span>🔥</span>
      <strong id="streak"></strong>
      <small>Days</small>
    </div>

    <div class="stat-card">
      <span>⭐</span>
      <strong id="points"></strong>
      <small>Points</small>
    </div>

    <div class="stat-card">
      <span>🏆</span>
      <strong id="lessonsDone"></strong>
      <small>Lessons</small>
    </div>

  </section>

  <section class="quote-card">
    <p id="dailyQuote"></p>
  </section>

  <section id="currentBlock"></section>

  <section>

    <div class="section-header">

      <h2>
        🗺️ Your Journey
      </h2>

      <button
        id="viewPath"
        class="secondary-btn">

        View Learning Path

      </button>

    </div>

    <div id="journey"></div>

  </section>

</main>

<div id="pathModal">

  <div class="modal-card">

    <h2>
      🗺️ Learning Path
    </h2>

    <div id="fullPath"></div>

    <button
      id="closeModal"
      class="primary-btn">

      Close

    </button>

  </div>

</div>

<script src="js/taxonomy.js"></script>
<script src="js/progress.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
