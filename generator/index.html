<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Short Vowels — Bento English</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #2563C8;
  min-height: 100vh;
  padding-bottom: 40px;
}
.header {
  background: #1a4a9e;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.back-btn {
  background: rgba(255,255,255,0.15);
  border: none;
  color: #fff;
  width: 36px; height: 36px;
  border-radius: 10px;
  font-size: 20px;
  cursor: pointer;
  flex-shrink: 0;
}
.header-title { color: #fff; font-size: 16px; font-weight: 700; flex: 1; }
.header-sub { color: rgba(255,255,255,0.65); font-size: 11px; }
.step { background: rgba(255,255,255,0.18); color: #fff; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
.progress-bar { padding: 10px 20px 0; }
.progress-track { height: 6px; background: rgba(255,255,255,0.25); border-radius: 99px; }
.progress-fill { height: 100%; background: #fff; border-radius: 99px; transition: width 0.4s; }
.card {
  background: #fff;
  border-radius: 16px;
  margin: 14px 16px 0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  overflow: hidden;
}
.phase-label {
  padding: 14px 18px 0;
  font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
  text-transform: uppercase; color: #2563C8;
  display: flex; align-items: center; gap: 8px;
}
.phase-dot { width: 8px; height: 8px; border-radius: 50%; background: #2563C8; }
.section { padding: 12px 18px 20px; }
.pattern-tag {
  display: inline-block;
  background: #ddeeff; color: #2563C8;
  font-size: 13px; font-weight: 700;
  padding: 4px 12px; border-radius: 20px; margin-bottom: 10px;
}
.instruction { font-size: 13px; color: #6b7280; margin-bottom: 14px; line-height: 1.5; }

/* PALAVRAS */
.word-list { display: flex; flex-direction: column; gap: 10px; }
.word-row {
  display: flex; align-items: center;
  background: #f0f4fb; border: 2px solid #e2e8f0;
  border-radius: 14px; padding: 14px 16px; gap: 12px; transition: all 0.15s;
}
.word-row.read { background: #dcfce7; border-color: #16a34a; }
.word-tap {
  flex: 1; font-family: Georgia, serif; font-size: 28px; font-weight: 700;
  color: #1a1a2e; text-align: left; cursor: pointer;
  background: none; border: none; padding: 0; line-height: 1.2;
}
.word-row.read .word-tap { color: #16a34a; }
.word-check { font-size: 18px; opacity: 0; transition: opacity 0.2s; min-width: 20px; text-align: center; }
.word-row.read .word-check { opacity: 1; }
.word-actions { display: flex; gap: 8px; flex-shrink: 0; }
.word-fb { padding: 0 16px 8px; display: none; }

/* BOTÕES DE AÇÃO */
.act-btn {
  background: #fff; border: 2px solid #e2e8f0; border-radius: 10px;
  width: 40px; height: 40px; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; flex-shrink: 0;
}
.act-btn:active { transform: scale(0.92); background: #f0f4fb; }
.act-btn.speaking { border-color: #2563C8; background: #ddeeff; }
.act-btn.recording { border-color: #dc2626; background: #fee2e2; animation: pulse-red 0.8s ease-in-out infinite; }
@keyframes pulse-red { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes spin { to { transform: rotate(360deg); } }

/* FEEDBACK */
.fb-tag {
  font-size: 12px; font-weight: 600; padding: 4px 10px;
  border-radius: 20px; display: inline-block;
}
.fb-ok  { background: #dcfce7; color: #16a34a; }
.fb-err { background: #fee2e2; color: #dc2626; }
.fb-wait { background: #fef9c3; color: #92400e; }

/* FRASES */
.sentence-list { display: flex; flex-direction: column; gap: 10px; }
.sent-card {
  background: #f0f4fb; border: 2px solid #e2e8f0;
  border-radius: 12px; padding: 12px 14px; transition: all 0.15s;
}
.sent-card.read { background: #dcfce7; border-color: #16a34a; }
.sent-top { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
.sent-num { font-size: 12px; font-weight: 700; color: #2563C8; min-width: 20px; padding-top: 3px; flex-shrink: 0; }
.sent-card.read .sent-num { color: #16a34a; }
.sent-text { font-family: Georgia, serif; font-size: 15px; line-height: 1.6; color: #1a1a2e; flex: 1; }
.sent-check { font-size: 16px; font-weight: 700; color: #16a34a; min-width: 16px; }
.sent-actions { display: flex; gap: 8px; }
.sent-fb { padding: 0 4px 4px; display: none; }

/* DIVIDER / ACTIONS */
.divider { height: 1px; background: #e2e8f0; margin: 0 18px 16px; }
.action-wrap { padding: 0 18px 20px; }
.action-btn {
  width: 100%; padding: 16px;
  background: #2563C8; color: #fff;
  border: none; border-radius: 12px;
  font-size: 16px; font-weight: 700;
  cursor: pointer; font-family: inherit;
}
.action-btn:disabled { background: #e2e8f0; color: #9ca3af; cursor: not-allowed; }
.action-btn.green { background: #16a34a; }

/* DONE */
.done-wrap { padding: 32px 24px; text-align: center; }
.done-icon { font-size: 56px; margin-bottom: 16px; }
.done-title { font-size: 22px; font-weight: 800; color: #1a1a2e; margin-bottom: 8px; }
.done-sub { font-size: 14px; color: #6b7280; line-height: 1.6; margin-bottom: 24px; }
.stats { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; }
.stat { background: #f0f4fb; border-radius: 12px; padding: 12px 20px; text-align: center; }
.stat-n { font-size: 24px; font-weight: 800; color: #2563C8; }
.stat-l { font-size: 11px; color: #6b7280; font-weight: 600; }
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="goBack()">&#8249;</button>
  <div style="flex:1">
    <div class="header-sub">Short Vowels</div>
    <div class="header-title" id="hTitle">Carregando...</div>
  </div>
  <div class="step" id="hStep">1 / 2</div>
</div>

<div class="progress-bar">
  <div class="progress-track">
    <div class="progress-fill" id="pFill" style="width:0%"></div>
  </div>
</div>

<div class="card" id="card">
  <div style="padding:48px 24px;text-align:center">
    <div style="width:36px;height:36px;border:4px solid #e2e8f0;border-top-color:#2563C8;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px"></div>
    <div style="font-size:14px;color:#6b7280">Preparando sua aula...</div>
  </div>
</div>

<script>
var LESSONS = [
  {
    id: "short-a", sub: "a = /a/",
    words: ["cab","dab","jab","tab","dam","jam","yam","gap","lap","nap","tap","van","ban","pan","ran","cap","map","rat","bat","cat","fat","hat","mat","pat","sat"],
    sentences: [
      "The cab has a gap in the tan top.",
      "Max had a nap on the flat mat.",
      "The fat cat sat on the hat.",
      "Pat the cat and tap the cap.",
      "Ban the van from the dam road.",
      "A rat ran and hid in the gap.",
      "Dab the wax on the pan, Jan.",
      "Tap the map and zap the cap."
    ]
  },
  {
    id: "short-i", sub: "i = /i/",
    words: ["bid","hid","kid","lid","dig","fig","pig","wig","dim","dip","lip","rip","sip","tip","zip","bit","hit","sit","fin","bin","pin","win","big","jig","rim"],
    sentences: [
      "The kid hid the lid in the dim bin.",
      "A big pig did a jig on the rim.",
      "Did Kim sip from the tip of the jug?",
      "Zip up and tip the bin, Jim.",
      "Hit the pin in the pit with the kit.",
      "Sit and fit the fin on the ship.",
      "Rip the wig off the big pig.",
      "Nip the fig at the tip of the stem."
    ]
  },
  {
    id: "short-u", sub: "u = /u/",
    words: ["bud","mud","bug","dug","hug","jug","mug","pug","rug","tug","bun","fun","run","sun","cut","hut","nut","but","cup","pup","rub","tub","gum","sum","sub"],
    sentences: [
      "A pug in the mud got a big hug.",
      "The bug dug under the sun-lit rug.",
      "Run to the hut but do not cut the bun.",
      "A nut fell in the mud by the hut.",
      "Cut the bun and put the nut in the mug.",
      "The pup ran from the tub to the cup.",
      "Rub the gum off the cup, son.",
      "Tug the rug out of the rut and have fun."
    ]
  },
  {
    id: "short-e", sub: "e = /e/",
    words: ["bed","fed","led","red","keg","leg","peg","gem","den","hen","pen","ten","get","jet","let","met","net","pet","wet","bet","set","beg","bell","fell","sell"],
    sentences: [
      "The red hen sat on ten eggs in the den.",
      "Get the wet pet to the vet, Ned.",
      "Peg the hem on the bed, Beth.",
      "Let the vet check the leg of the hen.",
      "Set the pen on the red mat, Jen.",
      "The bell fell off the red peg.",
      "Bet on the jet - ten men led the way.",
      "Yell and sell the gem at the keg fest."
    ]
  },
  {
    id: "short-o", sub: "o = /o/",
    words: ["bob","cob","job","sob","cog","dog","fog","hog","jog","log","cot","dot","got","hot","lot","pot","fox","box","top","cop","hop","mop","pop","rod","nod"],
    sentences: [
      "The fox got hot on a log in the fog.",
      "The dog can jog, not sob on the cot.",
      "A hot pot on the cot can rot the top.",
      "Bob the hog got a cob on the dot.",
      "The cop got a box of cod on the dock.",
      "Hop on top of the log, frog!",
      "Pop the pod and nod at the rod.",
      "Mop the hot top of the pot, Rob."
    ]
  }
];

var STORAGE_KEY = "bento_shortvowels";
var lesson = null;
var phase = "words";
var wordsDone = {};
var sentsDone = {};

function getProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveProgress(lessonId) {
  var p = getProgress();
  p[lessonId] = { done: true, at: Date.now() };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}
function pickLesson() {
  var done = Object.keys(getProgress());
  var remaining = LESSONS.filter(function(l) { return done.indexOf(l.id) === -1; });
  var pool = remaining.length > 0 ? remaining : LESSONS;
  return pool[Math.floor(Math.random() * pool.length)];
}
function wordsDoneSize() { return Object.keys(wordsDone).length; }
function sentsDoneSize() { return Object.keys(sentsDone).length; }

function setProgress(pct) {
  document.getElementById("pFill").style.width = pct + "%";
}

function renderWords() {
  phase = "words";
  document.getElementById("hTitle").textContent = lesson.sub;
  document.getElementById("hStep").textContent = "1 / 2";
  setProgress(Math.round(wordsDoneSize() / lesson.words.length * 50));

  var allRead = wordsDoneSize() === lesson.words.length;
  var html = "";
  html += '<div class="phase-label"><div class="phase-dot"></div> Fase 1 - Palavras</div>';
  html += '<div class="section">';
  html += '<div class="pattern-tag">' + lesson.sub + '</div>';
  html += '<p class="instruction">Toque na palavra para marcar como lida.</p>';
  html += '<div class="word-list">';
  for (var i = 0; i < lesson.words.length; i++) {
    var w = lesson.words[i];
    var isRead = !!wordsDone[i];
    html += '<div class="word-row' + (isRead ? ' read' : '') + '" id="wr-' + i + '">';
    html += '<button class="word-tap" onclick="tapWord(' + i + ')">' + w + '</button>';
    html += '<span class="word-check">&#10003;</span>';
    html += '<div class="word-actions">';
    html += '<button class="act-btn" id="sp-' + i + '" onclick="speakWord(\'' + w + '\',' + i + ')" title="Ouvir">&#128266;</button>';
    html += '<button class="act-btn" id="sl-' + i + '" onclick="spellWord(\'' + w + '\',' + i + ')" title="Soletrar">&#128292;</button>';
    html += '<button class="act-btn" id="mc-' + i + '" onclick="recordWord(\'' + w + '\',' + i + ')" title="Falar">&#127908;</button>';
    html += '</div></div>';
    html += '<div class="word-fb" id="fb-' + i + '"></div>';
  }
  html += '</div></div>';
  html += '<div class="divider"></div>';
  html += '<div class="action-wrap">';
  html += '<button class="action-btn" onclick="goSentences()"' + (allRead ? '' : ' disabled') + '>Avancar para Frases &rarr;</button>';
  html += '</div>';
  document.getElementById("card").innerHTML = html;
}

function renderSentences() {
  phase = "sentences";
  document.getElementById("hStep").textContent = "2 / 2";
  setProgress(50 + Math.round(sentsDoneSize() / lesson.sentences.length * 50));

  var allRead = sentsDoneSize() === lesson.sentences.length;
  var html = "";
  html += '<div class="phase-label"><div class="phase-dot" style="background:#7c3aed"></div> Fase 2 - Frases</div>';
  html += '<div class="section">';
  html += '<p class="instruction">Toque em &#127908; e leia a frase em voz alta para validar.</p>';
  html += '<div class="sentence-list">';
  for (var i = 0; i < lesson.sentences.length; i++) {
    var s = lesson.sentences[i];
    var isRead = !!sentsDone[i];
    var safeS = s.replace(/'/g, "&#39;");
    html += '<div class="sent-card' + (isRead ? ' read' : '') + '" id="sc-' + i + '">';
    html += '<div class="sent-top">';
    html += '<span class="sent-num">' + (i+1) + '.</span>';
    html += '<span class="sent-text">' + s + '</span>';
    html += '<span class="sent-check">' + (isRead ? '&#10003;' : '') + '</span>';
    html += '</div>';
    html += '<div class="sent-actions">';
    html += '<button class="act-btn" id="ssp-' + i + '" onclick="speakSent(' + i + ')" title="Ouvir">&#128266;</button>';
    html += '<button class="act-btn" id="smc-' + i + '" onclick="recordSent(' + i + ')" title="Falar">&#127908;</button>';
    html += '<button class="act-btn" onclick="tapSent(' + i + ')" title="Marcar">&#10003;</button>';
    html += '</div></div>';
    html += '<div class="sent-fb" id="sfb-' + i + '"></div>';
  }
  html += '</div></div>';
  html += '<div class="divider"></div>';
  html += '<div class="action-wrap">';
  html += '<button class="action-btn green" onclick="complete()"' + (allRead ? '' : ' disabled') + '>&#10003; Concluir Aula</button>';
  html += '</div>';
  document.getElementById("card").innerHTML = html;
}

function renderDone() {
  setProgress(100);
  document.getElementById("hStep").textContent = "ok";
  var prog = getProgress();
  var totalDone = Object.keys(prog).length;
  var html = "";
  html += '<div class="done-wrap">';
  html += '<div class="done-icon">&#127881;</div>';
  html += '<div class="done-title">Aula concluida!</div>';
  html += '<div class="done-sub">Voce leu <strong>' + lesson.words.length + ' palavras</strong> e <strong>' + lesson.sentences.length + ' frases</strong> com o padrao <strong>' + lesson.sub + '</strong>.</div>';
  html += '<div class="stats">';
  html += '<div class="stat"><div class="stat-n">' + lesson.words.length + '</div><div class="stat-l">Palavras</div></div>';
  html += '<div class="stat"><div class="stat-n">' + lesson.sentences.length + '</div><div class="stat-l">Frases</div></div>';
  html += '<div class="stat"><div class="stat-n">' + totalDone + '/' + LESSONS.length + '</div><div class="stat-l">Progresso</div></div>';
  html += '</div>';
  html += '<button class="action-btn green" style="margin-bottom:12px" onclick="goBack()">Voltar ao Dashboard</button>';
  html += '<button class="action-btn" style="margin-top:8px" onclick="nextLesson()">Proxima Aula &rarr;</button>';
  html += '</div>';
  document.getElementById("card").innerHTML = html;
}

function tapWord(i) {
  cancelTTS();
  if (wordsDone[i]) { delete wordsDone[i]; } else { wordsDone[i] = true; }
  renderWords();
}
function tapSent(i) {
  if (sentsDone[i]) { delete sentsDone[i]; } else { sentsDone[i] = true; }
  renderSentences();
}
function goSentences() {
  if (wordsDoneSize() === lesson.words.length) { cancelTTS(); renderSentences(); }
}
function complete() {
  if (sentsDoneSize() === lesson.sentences.length) { saveProgress(lesson.id); renderDone(); }
}
function nextLesson() {
  wordsDone = {}; sentsDone = {};
  lesson = pickLesson();
  renderWords();
}
function goBack() { window.location.href = "/dashboard.html"; }

// TTS
var ttsActive = null;

function ttsVoice() {
  var voices = speechSynthesis.getVoices();
  for (var i = 0; i < voices.length; i++) {
    if (voices[i].lang.indexOf('en') === 0 && voices[i].name.indexOf('Google') >= 0) return voices[i];
  }
  for (var i = 0; i < voices.length; i++) {
    if (voices[i].lang.indexOf('en-US') === 0) return voices[i];
  }
  for (var i = 0; i < voices.length; i++) {
    if (voices[i].lang.indexOf('en') === 0) return voices[i];
  }
  return null;
}

function cancelTTS() {
  speechSynthesis.cancel();
  ttsActive = null;
}

function speakWord(word, idx) {
  cancelTTS();
  ttsActive = { type: 'word', idx: idx };
  var utt = new SpeechSynthesisUtterance(word);
  utt.lang = 'en-US'; utt.rate = 0.85;
  var v = ttsVoice(); if (v) utt.voice = v;
  utt.onend = function() { ttsActive = null; };
  speechSynthesis.speak(utt);
}

function spellWord(word, idx) {
  cancelTTS();
  var letters = word.split('');
  var i = 0;
  function next() {
    if (i >= letters.length) return;
    var utt = new SpeechSynthesisUtterance(letters[i]);
    utt.lang = 'en-US'; utt.rate = 0.75;
    var v = ttsVoice(); if (v) utt.voice = v;
    utt.onend = function() { i++; next(); };
    speechSynthesis.speak(utt);
  }
  next();
}

function speakSent(idx) {
  cancelTTS();
  var s = lesson.sentences[idx];
  var utt = new SpeechSynthesisUtterance(s);
  utt.lang = 'en-US'; utt.rate = 0.82;
  var v = ttsVoice(); if (v) utt.voice = v;
  speechSynthesis.speak(utt);
}

// STT
var sttActive = null;

function showFb(id, type, msg) {
  var el = document.getElementById(id);
  if (!el) return;
  if (!type) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'block';
  el.innerHTML = '<span class="fb-tag fb-' + type + '">' + msg + '</span>';
}

function recordWord(word, idx) {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showFb('fb-' + idx, 'err', 'Navegador nao suporta voz'); return; }
  if (sttActive) { sttActive.abort(); sttActive = null; }
  cancelTTS();

  var rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 5;
  sttActive = rec;

  var btn = document.getElementById('mc-' + idx);
  if (btn) btn.classList.add('recording');
  showFb('fb-' + idx, 'wait', '&#127908; Ouvindo...');

  rec.onresult = function(e) {
    var expected = word.toLowerCase();
    var matched = false;
    for (var a = 0; a < e.results[0].length; a++) {
      if (e.results[0][a].transcript.trim().toLowerCase() === expected) { matched = true; break; }
    }
    var heard = e.results[0][0].transcript;
    if (matched) {
      showFb('fb-' + idx, 'ok', '&#10003; Correto! "' + heard + '"');
      wordsDone[idx] = true;
      var row = document.getElementById('wr-' + idx);
      if (row) { row.classList.add('read'); }
      if (wordsDoneSize() === lesson.words.length) {
        var btn2 = document.querySelector('.action-btn');
        if (btn2) btn2.disabled = false;
      }
    } else {
      showFb('fb-' + idx, 'err', '&#10060; Ouvi: "' + heard + '" - tente de novo');
    }
  };
  rec.onerror = function(e) {
    if (e.error === 'no-speech') { showFb('fb-' + idx, 'err', 'Nao ouvi nada'); return; }
    if (e.error === 'aborted') { showFb('fb-' + idx, null, null); return; }
    showFb('fb-' + idx, 'err', 'Erro: ' + e.error);
  };
  rec.onend = function() {
    var b = document.getElementById('mc-' + idx);
    if (b) b.classList.remove('recording');
    sttActive = null;
  };
  rec.start();
}

function recordSent(idx) {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showFb('sfb-' + idx, 'err', 'Navegador nao suporta voz'); return; }
  if (sttActive) { sttActive.abort(); sttActive = null; }
  cancelTTS();

  var sentence = lesson.sentences[idx];
  var rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 3;
  sttActive = rec;

  var btn = document.getElementById('smc-' + idx);
  if (btn) btn.classList.add('recording');
  showFb('sfb-' + idx, 'wait', '&#127908; Ouvindo...');

  rec.onresult = function(e) {
    var heard = e.results[0][0].transcript.toLowerCase().replace(/[^a-z\s]/g,'').trim();
    var expected = sentence.toLowerCase().replace(/[^a-z\s]/g,'').trim();
    var heardW = heard.split(/\s+/);
    var expW = expected.split(/\s+/);
    var matches = 0;
    for (var j = 0; j < expW.length; j++) {
      if (heardW.indexOf(expW[j]) >= 0) matches++;
    }
    var score = Math.round(matches / expW.length * 100);
    if (score >= 70) {
      showFb('sfb-' + idx, 'ok', '&#10003; Otimo! (' + score + '% correto)');
      sentsDone[idx] = true;
      var card = document.getElementById('sc-' + idx);
      if (card) {
        card.classList.add('read');
        var chk = card.querySelector('.sent-check');
        if (chk) chk.textContent = '\u2713';
      }
      if (sentsDoneSize() === lesson.sentences.length) {
        var btn2 = document.querySelector('.action-btn.green');
        if (btn2) btn2.disabled = false;
      }
    } else {
      showFb('sfb-' + idx, 'err', '&#10060; ' + score + '% correto - Ouvi: "' + e.results[0][0].transcript + '"');
    }
  };
  rec.onerror = function(e) {
    if (e.error === 'no-speech') { showFb('sfb-' + idx, 'err', 'Nao ouvi nada'); return; }
    if (e.error === 'aborted') { showFb('sfb-' + idx, null, null); return; }
    showFb('sfb-' + idx, 'err', 'Erro: ' + e.error);
  };
  rec.onend = function() {
    var b = document.getElementById('smc-' + idx);
    if (b) b.classList.remove('recording');
    sttActive = null;
  };
  rec.start();
}

// INIT
lesson = pickLesson();
renderWords();
</script>
