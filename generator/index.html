<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Short Vowels — Bento English</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #2563C8;
  min-height: 100vh;
  padding-bottom: 40px;
}

.header {
  background: #1a4a9e;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.back-btn {
  background: rgba(255,255,255,0.15);
  border: none;
  color: #fff;
  width: 36px; height: 36px;
  border-radius: 10px;
  font-size: 20px;
  cursor: pointer;
  flex-shrink: 0;
}
.header-title { color: #fff; font-size: 16px; font-weight: 700; flex: 1; }
.header-sub { color: rgba(255,255,255,0.65); font-size: 11px; }
.step { background: rgba(255,255,255,0.18); color: #fff; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }

.progress-bar { padding: 10px 20px 0; }
.progress-track { height: 6px; background: rgba(255,255,255,0.25); border-radius: 99px; }
.progress-fill { height: 100%; background: #fff; border-radius: 99px; transition: width 0.4s; }

.card {
  background: #fff;
  border-radius: 16px;
  margin: 14px 16px 0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  overflow: hidden;
}

.phase-label {
  padding: 14px 18px 0;
  font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
  text-transform: uppercase; color: #2563C8;
  display: flex; align-items: center; gap: 8px;
}
.phase-dot { width: 8px; height: 8px; border-radius: 50%; background: #2563C8; }

.section { padding: 12px 18px 20px; }

.pattern-tag {
  display: inline-block;
  background: #ddeeff; color: #2563C8;
  font-size: 13px; font-weight: 700;
  padding: 4px 12px; border-radius: 20px; margin-bottom: 10px;
}
.instruction { font-size: 13px; color: #6b7280; margin-bottom: 14px; line-height: 1.5; }

.word-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.word-btn {
  background: #f0f4fb;
  border: 2px solid #e2e8f0;
  border-radius: 12px;
  padding: 14px 8px;
  text-align: center;
  font-size: 18px; font-weight: 700;
  font-family: Georgia, serif;
  color: #1a1a2e;
  cursor: pointer;
  transition: all 0.15s;
}
.word-btn.read {
  background: #dcfce7;
  border-color: #16a34a;
  color: #16a34a;
}

.sentence-list { display: flex; flex-direction: column; gap: 8px; }
.sent-btn {
  display: flex; gap: 10px; align-items: flex-start;
  background: #f0f4fb; border: 2px solid #e2e8f0;
  border-radius: 12px; padding: 12px 14px;
  cursor: pointer; text-align: left; width: 100%;
  transition: all 0.15s;
}
.sent-btn.read { background: #dcfce7; border-color: #16a34a; }
.sent-num { font-size: 12px; font-weight: 700; color: #2563C8; min-width: 20px; padding-top: 2px; }
.sent-btn.read .sent-num { color: #16a34a; }
.sent-text { font-family: Georgia, serif; font-size: 15px; line-height: 1.6; color: #1a1a2e; }
.sent-check { margin-left: auto; font-size: 16px; opacity: 0; padding-top: 2px; }
.sent-btn.read .sent-check { opacity: 1; }

.divider { height: 1px; background: #e2e8f0; margin: 0 18px 16px; }
.action-wrap { padding: 0 18px 20px; }
.action-btn {
  width: 100%; padding: 16px;
  background: #2563C8; color: #fff;
  border: none; border-radius: 12px;
  font-size: 16px; font-weight: 700;
  cursor: pointer; font-family: inherit;
}
.action-btn:disabled { background: #e2e8f0; color: #9ca3af; cursor: not-allowed; }
.action-btn.green { background: #16a34a; }

.done-wrap { padding: 32px 24px; text-align: center; }
.done-icon { font-size: 56px; margin-bottom: 16px; }
.done-title { font-size: 22px; font-weight: 800; color: #1a1a2e; margin-bottom: 8px; }
.done-sub { font-size: 14px; color: #6b7280; line-height: 1.6; margin-bottom: 24px; }
.stats { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; }
.stat { background: #f0f4fb; border-radius: 12px; padding: 12px 20px; text-align: center; }
.stat-n { font-size: 24px; font-weight: 800; color: #2563C8; }
.stat-l { font-size: 11px; color: #6b7280; font-weight: 600; }
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="goBack()">‹</button>
  <div style="flex:1">
    <div class="header-sub" id="hSub">Short Vowels</div>
    <div class="header-title" id="hTitle">Carregando...</div>
  </div>
  <div class="step" id="hStep">1 / 2</div>
</div>

<div class="progress-bar">
  <div class="progress-track">
    <div class="progress-fill" id="pFill" style="width:0%"></div>
  </div>
</div>

<div class="card" id="card">
  <div style="padding:48px 24px;text-align:center">
    <div style="width:36px;height:36px;border:4px solid #e2e8f0;border-top-color:#2563C8;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px"></div>
    <div style="font-size:14px;color:#6b7280">Preparando sua aula...</div>
  </div>
</div>

<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<script>
// ── LIÇÕES ──────────────────────────────────────────────
const LESSONS = [
  {
    id: "short-a", sub: "a = /ă/",
    words: ["cab","dab","jab","tab","dam","jam","yam","gap","lap","nap","tap","van","ban","pan","ran","cap","map","rat","bat","cat","fat","hat","mat","pat","sat"],
    sentences: [
      "The cab has a gap in the tan top.",
      "Max had a nap on the flat mat.",
      "The fat cat sat on the hat.",
      "Pat the cat and tap the cap.",
      "Ban the van from the dam road.",
      "A rat ran and hid in the gap.",
      "Dab the wax on the pan, Jan.",
      "Tap the map and zap the cap.",
    ]
  },
  {
    id: "short-i", sub: "i = /ĭ/",
    words: ["bid","hid","kid","lid","dig","fig","pig","wig","dim","dip","lip","rip","sip","tip","zip","bit","hit","sit","fin","bin","pin","win","big","jig","rim"],
    sentences: [
      "The kid hid the lid in the dim bin.",
      "A big pig did a jig on the rim.",
      "Did Kim sip from the tip of the jug?",
      "Zip up and tip the bin, Jim.",
      "Hit the pin in the pit with the kit.",
      "Sit and fit the fin on the ship.",
      "Rip the wig off the big pig.",
      "Nip the fig at the tip of the stem.",
    ]
  },
  {
    id: "short-u", sub: "u = /ŭ/",
    words: ["bud","mud","bug","dug","hug","jug","mug","pug","rug","tug","bun","fun","run","sun","cut","hut","nut","but","cup","pup","rub","tub","gum","sum","sub"],
    sentences: [
      "A pug in the mud got a big hug.",
      "The bug dug under the sun-lit rug.",
      "Run to the hut but do not cut the bun.",
      "A nut fell in the mud by the hut.",
      "Cut the bun and put the nut in the mug.",
      "The pup ran from the tub to the cup.",
      "Rub the gum off the cup, son.",
      "Tug the rug out of the rut and have fun.",
    ]
  },
  {
    id: "short-e", sub: "e = /ĕ/",
    words: ["bed","fed","led","red","keg","leg","peg","gem","den","hen","pen","ten","get","jet","let","met","net","pet","wet","bet","set","beg","bell","fell","sell"],
    sentences: [
      "The red hen sat on ten eggs in the den.",
      "Get the wet pet to the vet, Ned.",
      "Peg the hem on the bed, Beth.",
      "Let the vet check the leg of the hen.",
      "Set the pen on the red mat, Jen.",
      "The bell fell off the red peg.",
      "Bet on the jet — ten men led the way.",
      "Yell and sell the gem at the keg fest.",
    ]
  },
  {
    id: "short-o", sub: "o = /ŏ/",
    words: ["bob","cob","job","sob","cog","dog","fog","hog","jog","log","cot","dot","got","hot","lot","pot","fox","box","top","cop","hop","mop","pop","rod","nod"],
    sentences: [
      "The fox got hot on a log in the fog.",
      "The dog can jog, not sob on the cot.",
      "A hot pot on the cot can rot the top.",
      "Bob the hog got a cob on the dot.",
      "The cop got a box of cod on the dock.",
      "Hop on top of the log, frog!",
      "Pop the pod and nod at the rod.",
      "Mop the hot top of the pot, Rob.",
    ]
  },
];

// ── ESTADO ──────────────────────────────────────────────
const STORAGE_KEY = "bento_shortvowels";

function getProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } 
  catch { return {}; }
}
function saveProgress(lessonId) {
  const p = getProgress();
  p[lessonId] = { done: true, at: Date.now() };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}
function pickLesson() {
  const done = Object.keys(getProgress());
  const remaining = LESSONS.filter(l => !done.includes(l.id));
  const pool = remaining.length > 0 ? remaining : LESSONS;
  return pool[Math.floor(Math.random() * pool.length)];
}

let lesson = null;
let phase = "words";
let wordsDone = new Set();
let sentsDone = new Set();

// ── RENDER ──────────────────────────────────────────────
function setProgress(pct) {
  document.getElementById("pFill").style.width = pct + "%";
}

function renderWords() {
  phase = "words";
  document.getElementById("hTitle").textContent = lesson.sub;
  document.getElementById("hStep").textContent = "1 / 2";
  setProgress(Math.round(wordsDone.size / lesson.words.length * 50));

  const allRead = wordsDone.size === lesson.words.length;
  document.getElementById("card").innerHTML = `
    <div class="phase-label"><div class="phase-dot"></div> Fase 1 — Palavras</div>
    <div class="section">
      <div class="pattern-tag">${lesson.sub}</div>
      <p class="instruction">Toque em cada palavra para marcá-la como lida. Leia em voz alta!</p>
      <div class="word-grid">
        ${lesson.words.map((w,i) => `
          <button class="word-btn ${wordsDone.has(i)?'read':''}" onclick="tapWord(${i})">${w}${wordsDone.has(i)?' ✓':''}</button>
        `).join("")}
      </div>
    </div>
    <div class="divider"></div>
    <div class="action-wrap">
      <button class="action-btn" onclick="goSentences()" ${allRead?'':'disabled'}>
        Avançar para Frases →
      </button>
    </div>
  `;
}

function renderSentences() {
  phase = "sentences";
  document.getElementById("hStep").textContent = "2 / 2";
  setProgress(50 + Math.round(sentsDone.size / lesson.sentences.length * 50));

  const allRead = sentsDone.size === lesson.sentences.length;
  document.getElementById("card").innerHTML = `
    <div class="phase-label"><div class="phase-dot" style="background:#7c3aed"></div> Fase 2 — Frases</div>
    <div class="section">
      <p class="instruction">Leia cada frase em voz alta. Toque para marcar como concluída.</p>
      <div class="sentence-list">
        ${lesson.sentences.map((s,i) => `
          <button class="sent-btn ${sentsDone.has(i)?'read':''}" onclick="tapSent(${i})">
            <span class="sent-num">${i+1}.</span>
            <span class="sent-text">${s}</span>
            <span class="sent-check">✓</span>
          </button>
        `).join("")}
      </div>
    </div>
    <div class="divider"></div>
    <div class="action-wrap">
      <button class="action-btn green" onclick="complete()" ${allRead?'':'disabled'}>
        ✓ Concluir Aula
      </button>
    </div>
  `;
}

function renderDone() {
  setProgress(100);
  document.getElementById("hStep").textContent = "✓";
  const prog = getProgress();
  const totalDone = Object.keys(prog).length;

  document.getElementById("card").innerHTML = `
    <div class="done-wrap">
      <div class="done-icon">🎉</div>
      <div class="done-title">Aula concluída!</div>
      <div class="done-sub">Você leu <strong>${lesson.words.length} palavras</strong> e <strong>${lesson.sentences.length} frases</strong> com o padrão <strong>${lesson.sub}</strong>.</div>
      <div class="stats">
        <div class="stat"><div class="stat-n">${lesson.words.length}</div><div class="stat-l">Palavras</div></div>
        <div class="stat"><div class="stat-n">${lesson.sentences.length}</div><div class="stat-l">Frases</div></div>
        <div class="stat"><div class="stat-n">${totalDone}/${LESSONS.length}</div><div class="stat-l">Progresso</div></div>
      </div>
      <button class="action-btn green" style="margin-bottom:12px" onclick="goBack()">Voltar ao Dashboard</button>
      <button class="action-btn" style="margin-top:8px" onclick="nextLesson()">Próxima Aula →</button>
    </div>
  `;
}

// ── AÇÕES ────────────────────────────────────────────────
function tapWord(i) {
  wordsDone.has(i) ? wordsDone.delete(i) : wordsDone.add(i);
  renderWords();
}
function tapSent(i) {
  sentsDone.has(i) ? sentsDone.delete(i) : sentsDone.add(i);
  renderSentences();
}
function goSentences() {
  if (wordsDone.size === lesson.words.length) renderSentences();
}
function complete() {
  if (sentsDone.size === lesson.sentences.length) {
    saveProgress(lesson.id);
    renderDone();
  }
}
function nextLesson() {
  wordsDone.clear(); sentsDone.clear();
  lesson = pickLesson();
  renderWords();
}
function goBack() {
  window.location.href = "/dashboard.html";
}

// ── INIT ─────────────────────────────────────────────────
lesson = pickLesson();
renderWords();
</script>
</body>
</html>
