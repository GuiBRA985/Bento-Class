<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Bento Generator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 30px;
    }

    .card {
      background: white;
      max-width: 800px;
      margin: auto;
      padding: 30px;
      border-radius: 24px;
      box-shadow:
        0 10px 30px
        rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    button {
      border: none;
      background: #2d5fff;
      color: white;
      padding: 14px 24px;
      border-radius: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="card">

  <h1>
    Bento Generator
  </h1>

  <p id="path"></p>

  <button
    onclick="finishLesson()">

    Finish Lesson

  </button>

</div>

<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const group =
  params.get("group") || 0;

const sub =
  params.get("sub") || 0;

document.getElementById(
  "path"
).innerText =
  `Group: ${group}
Subgroup: ${sub}`;

function finishLesson() {
  window.location.href =
    "../dashboard.html";
}

</script>

</body>
</html>
