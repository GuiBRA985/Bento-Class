<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula Fonética — Bento English</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:       #2563C8;
    --blue-dark:  #1a4a9e;
    --blue-light: #ddeeff;
    --white:      #ffffff;
    --bg:         #f0f4fb;
    --text:       #1a1a2e;
    --muted:      #6b7280;
    --border:     #e2e8f0;
    --green:      #16a34a;
    --green-light:#dcfce7;
    --radius:     16px;
    --shadow:     0 2px 12px rgba(0,0,0,0.08);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--blue);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 40px;
  }

  /* ── HEADER ── */
  .header {
    width: 100%;
    background: var(--blue-dark);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .back-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 36px; height: 36px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.25); }
  .header-info { flex: 1; }
  .header-info .label {
    font-size: 11px; color: rgba(255,255,255,0.65);
    font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
  }
  .header-info .title {
    font-size: 16px; font-weight: 700; color: #fff; margin-top: 1px;
  }
  .step-badge {
    background: rgba(255,255,255,0.18);
    color: #fff;
    font-size: 12px; font-weight: 700;
    padding: 4px 10px; border-radius: 20px;
  }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    width: 100%; padding: 12px 20px 0;
  }
  .progress-track {
    height: 6px; background: rgba(255,255,255,0.25); border-radius: 99px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: #fff; border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* ── CARD ── */
  .card {
    background: var(--white);
    border-radius: var(--radius);
    margin: 14px 16px 0;
    width: calc(100% - 32px);
    max-width: 480px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* ── PHASE LABEL ── */
  .phase-label {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 18px 0;
    font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--blue);
  }
  .phase-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--blue);
  }

  /* ── WORD PHASE ── */
  .word-area {
    padding: 10px 18px 20px;
  }
  .word-instruction {
    font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.5;
  }
  .phoneme-tag {
    display: inline-block;
    background: var(--blue-light); color: var(--blue);
    font-size: 13px; font-weight: 700;
    padding: 4px 12px; border-radius: 20px; margin-bottom: 14px;
  }
  .word-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .word-card {
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    font-family: Georgia, serif;
    letter-spacing: 0.5px;
  }
  .word-card:active { transform: scale(0.95); }
  .word-card.read {
    background: var(--green-light);
    border-color: var(--green);
    color: var(--green);
  }
  .word-card.read::after {
    content: " ✓";
    font-size: 13px;
  }

  /* ── SENTENCE PHASE ── */
  .sentence-area { padding: 10px 18px 20px; }
  .sentence-instruction {
    font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height: 1.5;
  }
  .sentence-list { display: flex; flex-direction: column; gap: 8px; }
  .sentence-item {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--bg); border: 2px solid var(--border);
    border-radius: 12px; padding: 12px 14px;
    cursor: pointer; transition: all 0.15s;
    user-select: none;
  }
  .sentence-item:active { transform: scale(0.98); }
  .sentence-item.read {
    background: var(--green-light);
    border-color: var(--green);
  }
  .sentence-num {
    font-size: 12px; font-weight: 700; color: var(--blue);
    min-width: 20px; padding-top: 1px;
  }
  .sentence-item.read .sentence-num { color: var(--green); }
  .sentence-text {
    font-family: Georgia, serif;
    font-size: 15px; line-height: 1.6; color: var(--text);
  }
  .sentence-check {
    margin-left: auto; font-size: 16px; padding-top: 1px;
    opacity: 0; transition: opacity 0.15s;
  }
  .sentence-item.read .sentence-check { opacity: 1; }

  /* ── TIP BOX ── */
  .tip-box {
    margin: 0 18px 16px;
    background: #fffbeb; border: 1.5px solid #f59e0b;
    border-radius: 10px; padding: 10px 14px;
    font-size: 12px; color: #92400e; line-height: 1.5;
  }
  .tip-box strong { display: block; margin-bottom: 2px; }

  /* ── ACTION BUTTON ── */
  .action-area { padding: 0 18px 20px; }
  .action-btn {
    width: 100%; padding: 16px;
    background: var(--blue); color: #fff;
    border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .action-btn:hover { background: var(--blue-dark); }
  .action-btn:active { transform: scale(0.98); }
  .action-btn:disabled {
    background: var(--border); color: var(--muted); cursor: not-allowed;
  }
  .action-btn.complete {
    background: var(--green);
  }
  .action-btn.complete:hover { background: #15803d; }

  /* ── DIVIDER ── */
  .divider {
    height: 1px; background: var(--border); margin: 0 18px 16px;
  }

  /* ── COMPLETION SCREEN ── */
  .completion {
    padding: 32px 24px;
    text-align: center;
  }
  .completion-icon { font-size: 56px; margin-bottom: 16px; }
  .completion-title { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
  .completion-sub { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
  .completion-stats {
    display: flex; gap: 12px; justify-content: center; margin-bottom: 24px;
  }
  .stat-box {
    background: var(--bg); border-radius: 12px; padding: 12px 20px; text-align: center;
  }
  .stat-num { font-size: 24px; font-weight: 800; color: var(--blue); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 600; }

  /* ── LOADING ── */
  .loading-state {
    padding: 48px 24px; text-align: center;
  }
  .spinner {
    width: 40px; height: 40px; border: 4px solid var(--border);
    border-top-color: var(--blue); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── PATTERN HINT ── */
  .pattern-pill {
    display: inline-block;
    background: var(--blue); color: #fff;
    font-size: 14px; font-weight: 800;
    padding: 5px 14px; border-radius: 20px;
    font-family: Georgia, serif; letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .group-breadcrumb {
    font-size: 11px; color: var(--muted);
    padding: 0 18px 12px; display: flex; gap: 4px; align-items: center;
  }
  .crumb { color: var(--blue); font-weight: 600; }
</style>
</head>
