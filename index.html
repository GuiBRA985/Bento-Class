<!DOCTYPE html><html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento Class</title><style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#ffffff;
        min-height:100vh;
        display:flex;
        flex-direction:column;
    }

    header{
        display:flex;
        justify-content:flex-end;
        padding:20px;
        gap:10px;
    }

    .btn{
        padding:10px 20px;
        border:none;
        border-radius:8px;
        cursor:pointer;
        text-decoration:none;
        font-weight:bold;
    }

    .login{
        background:#f1f1f1;
        color:#333;
    }

    .signup{
        background:#000;
        color:#fff;
    }

    main{
        flex:1;
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
        padding:40px;
    }

    h1{
        font-size:3rem;
        max-width:900px;
        line-height:1.3;
        font-weight:700;
    }

    .subtitle{
        margin-top:20px;
        color:#666;
        font-size:1.1rem;
    }
</style>

</head>
<body><header>
    <a href="login.html" class="btn login">Entrar</a>
    <a href="signup.html" class="btn signup">Cadastrar</a>
</header><main>
    <div>
        <h1>
            A linguagem é a única coisa que te conecta ao mundo inteiro
        </h1>    <p class="subtitle">
        Aprenda inglês através da leitura fonética estruturada.
    </p>
</div>

</main></body>
</html>
