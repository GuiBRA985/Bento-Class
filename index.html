<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Class Bento - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .container {
      width: 380px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .slogan {
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 25px;
      font-style: italic;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      color: white;
    }

    .login {
      background: #3b82f6;
    }

    .login:hover {
      background: #2563eb;
    }

    .signup {
      background: #10b981;
    }

    .signup:hover {
      background: #059669;
    }

    .msg {
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Class Bento</h1>

    <div class="slogan">
      “A língua é a única coisa que te conecta com o mundo inteiro”
    </div>

    <input id="email" type="email" placeholder="Seu e-mail" />
    <input id="password" type="password" placeholder="Sua senha" />

    <button class="login" onclick="login()">Entrar</button>
    <button class="signup" onclick="signup()">Cadastrar</button>

    <div class="msg" id="msg"></div>
  </div>

<script>
  const supabaseUrl = "https://SEU-PROJETO.supabase.co";
  const supabaseKey = "SUA_ANON_KEY";

  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  const msg = document.getElementById("msg");

  async function login() {
    msg.innerText = "Entrando...";

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      msg.innerText = "Erro no login: " + error.message;
      return;
    }

    msg.innerText = "Login realizado com sucesso!";

    setTimeout(() => {
      window.location.href = "/dashboard.html";
    }, 800);
  }

  async function signup() {
  msg.innerText = "Criando conta...";

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabase.auth.signUp({
    email,
    password
  });

  if (error) {
    msg.innerText = "Erro no cadastro: " + error.message;
    return;
  }

  msg.innerText = "Conta criada! Entrando...";

  // tenta logar automaticamente após cadastro
  const { error: loginError } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (loginError) {
    msg.innerText = "Conta criada, mas login falhou.";
    return;
  }

  setTimeout(() => {
    window.location.href = "/dashboard.html";
  }, 800);
}

    msg.innerText = "Conta criada! Verifique seu e-mail (se confirmação estiver ativa).";
  }
</script>

</body>
</html>
