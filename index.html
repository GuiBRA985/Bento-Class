<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Class Bento - Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .container {
      width: 380px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 26px;
      letter-spacing: 1px;
    }

    .slogan {
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 25px;
      font-style: italic;
      line-height: 1.4;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      background: #3b82f6;
      color: #fff;
      transition: 0.2s;
    }

    .btn:hover {
      transform: scale(1.03);
      background: #2563eb;
    }

    .footer {
      margin-top: 18px;
      font-size: 11px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Class Bento</h1>

    <div class="slogan">
      “A língua é a única coisa que te conecta com o mundo inteiro”
    </div>

    <input type="email" placeholder="Seu e-mail" />
    <input type="password" placeholder="Sua senha" />

    <button class="btn">Entrar</button>

    <div class="footer">
      class.bento.host
    </div>
  </div>

</body>
</html>
