<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bento Class</title><style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#1565C0;

    color:white;

    font-family:Arial, Helvetica, sans-serif;

    text-align:center;
}

.container{

    max-width:900px;
    padding:40px;

}

.logo{

    font-size:4rem;
    font-weight:bold;

    margin-bottom:40px;

    letter-spacing:2px;
}

.slogan{

    font-size:2rem;

    line-height:1.6;

    margin-bottom:60px;

    font-weight:300;
}

.btn{

    display:inline-block;

    padding:18px 50px;

    background:white;

    color:#1565C0;

    text-decoration:none;

    font-size:1.2rem;

    font-weight:bold;

    border-radius:12px;

    transition:0.3s;
}

.btn:hover{

    transform:translateY(-3px);

}

.footer{

    margin-top:60px;

    opacity:0.8;

    font-size:0.9rem;
}

</style></head><body><div class="container"><div class="logo">
    Bento Class
</div>

<div class="slogan">
    A linguagem é a única coisa que te conecta ao mundo inteiro.
</div>

<a href="login.html" class="btn">
    Entrar
</a>

<div class="footer">
    © Bento Class
</div>

</div></body></html>
