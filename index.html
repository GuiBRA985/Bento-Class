<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Class Bento - Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .container {
      width: 360px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 26px;
    }

    p {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 30px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .btn:hover {
      transform: scale(1.03);
    }

    .google { background: #fff; color: #000; }
    .github { background: #24292e; color: #fff; }
    .facebook { background: #1877f2; color: #fff; }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Class Bento</h1>
    <p>Entre para acessar sua área de aprendizado</p>

    <button class="btn google">🔵 Entrar com Google</button>
    <button class="btn github">🐙 Entrar com GitHub</button>
    <button class="btn facebook">📘 Entrar com Facebook</button>

    <div class="footer">
      acesso seguro • class.bento.host
    </div>
  </div>

</body>
</html>
